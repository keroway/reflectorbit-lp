# エージェント自動化のオプトイン設定。
# issue-refinement / issue-sprint skill が前提条件として読む。
enabled: true

# issue-sprint が 1 サイクルで扱う Issue 数の上限（契約上 1 が最大）。
max_issues_per_cycle: 1

# 自動マージを許可する。squash merge は issue-sprint の merge gate
# (CI green / レビュー解消済み / branch protection 満たす) を通過した場合のみ実行される。
allow_merge: true

# keroway/.github#28 の reusable workflow(`.github/workflows/ci-failure-issue.yml`)
# を導入済みで、CI失敗時のissue起票/更新が既にGitHub Actions側で決定的に
# 行われている(agent-assets#394)。ci-triage(LLMセッションでのCI失敗解析)を
# 候補から外す。
ci_failure_issue_deployed: true
