name: asset-drift

# public/og-default.png と public/videos/how-to-play.* は「ローカルで生成コマンドを
# 実行してコミットし、CI では再生成しない」運用（docs/development.md / CLAUDE.md）。
# そのため、デザインソース（public/og-default.svg / video/how-to-play/*）だけを編集して
# 生成コマンドの実行・コミットを忘れても、CI / Lint も Site / Typecheck・E2E も気付かない
# (#160)。
#
# 検知は「CI で再生成して git diff --exit-code」ではなく、生成コマンド実行時に
# scripts/asset-manifest.mjs が asset-manifest.json へ記録するソースハッシュとの
# 照合で行う (#185)。旧方式は「mp4 / poster / PNG は再生成してもバイト一致する」
# 前提だったが、これは同一環境（ローカル macOS）内でのみ成立し、ubuntu ランナーでは
# フォントレンダリング等の環境差で 3 ファイルすべてバイト差分が出る
# （導入以来の週次実行 2 回が両方ともこの誤検知で failure だった）。
# ハッシュ照合は決定論的・環境非依存で、pnpm install / Chrome / ffmpeg も不要。
#
# 毎 PR のブロッキングチェックにすると無関係な PR まで赤くするリスクがあるため、
# 週次 cron の可視化ジョブとして独立させ、PR をブロックしない
# （workflow-lint.yml の週次パターンに合わせた）。
on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  drift-check:
    name: Detect generated asset drift
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'
      - name: Verify generated assets are in sync with sources
        run: node scripts/asset-manifest.mjs verify
