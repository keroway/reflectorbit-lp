# CI (workflows/ci.yml) が失敗したら決定的にissueを起票/コメント追記する。
# LLMポーリング（agent-assets の ci-triage モード）の代替（keroway/.github#28）。
#
# 監視対象は name: CI（.github/workflows/ci.yml）。workflow_run はworkflow名で
# マッチするため、ci.yml側の `name:` を変える場合はここも合わせて変更すること。
name: ci-failure-issue

# workflow_run自体は一般に危険だが、呼び出し先 reusable-ci-failure-issue.yml は
# PRコードのcheckoutもshell実行もせず、run.name/run.head_branchを切り詰めた上で
# GitHub API（issues.create/createComment）の引数として渡すだけ（keroway/.github#31で監査済み）。
on: # zizmor: ignore[dangerous-triggers] — 詳細は上のコメント参照
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  issues: write

jobs:
  file-or-update-issue:
    if: github.event.workflow_run.conclusion == 'failure'
    # SHA は keroway/.github の main（2026-09-09 時点でレビュー済み）に固定。
    # 更新手順は docs/reusable-workflow-sha-pinning.md を参照。
    uses: keroway/.github/.github/workflows/reusable-ci-failure-issue.yml@f46116661fa12e4ff3911c40970cf0f8510e9823
    with:
      extra-body: ""
