name: CI

# 静的解析のみ（lint）。paths フィルタを付けず全 PR で必ず起動する
# （prettier が **/*.md を見るため、docs だけの変更でも必要）。
# ビルド + ブラウザ検証（typecheck / e2e）は site.yml に分離し、src/public/tests
# に触った PR だけ起動する。依存脆弱性監査は osv-scan.yml に一本化した
# （ここにあった `pnpm audit` は無関係な PR を外部 advisory の更新で赤くしていたため削除）。
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # pnpm のバージョンは package.json の packageManager フィールドから解決される。
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
