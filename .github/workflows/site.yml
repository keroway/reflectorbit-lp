name: Site

# 配信物に影響する差分に限って、ビルド + Playwright(smoke/a11y、320px 幅の横スクロール検証のみの
# mobile-320) を実行する。
# このリポジトリの main-protection ruleset には required status checks を設定していない
# （required にしているのは CI / Lint のみ）。そのため paths でジョブごと起動しない方式が
# 安全に成立する（起動しなくても PR が Pending で詰まらない）。
# ★ Typecheck / E2E を required status check に追加する場合は、workflow-level paths をやめて
#   「常に起動し、先頭の changes ジョブで後続を if: 制御する」方式（兄弟リポ code-tactics-lp の
#   .github/workflows/ci.yml が前例）へ移行すること。さもないと docs だけの PR が Pending のまま
#   マージ不能になる。
on:
  pull_request:
    paths:
      - "src/**"
      - "public/**"
      - "tests/**"
      - "video/**"
      - "astro.config.mjs"
      - "playwright.config.ts"
      - "tsconfig.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/site.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck

  e2e:
    name: E2E (build + Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run build
      # smoke / a11y / mobile-320 を 1 プロセスで実行する（preview サーバー起動も 1 回で済む）。
      # mobile-320 は @mobile タグを付けた 1 テスト（320px 幅での横スクロール検証）のみを実行し、
      # smoke/a11y の他のケースは chromium プロジェクト（Desktop Chrome viewport）でのみ検証される。
      - run: pnpm test
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
