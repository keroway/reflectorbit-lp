# 各リポジトリの .github/workflows/workflow-lint.yml に配置する呼び出し元。
name: workflow-lint

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "**/*.sh"
  # PR の paths は actionlint/zizmor/shellcheck 向けに絞ってあるため typos がリポジトリ全体
  # （docs/ や src/）を検査する機会が無い。週次で全ジョブを走らせてそこを埋める。
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    # SHA は keroway/.github の main（2026-09-05 時点でレビュー済み）に固定。更新手順は
    # docs/reusable-workflow-sha-pinning.md を参照。
    uses: keroway/.github/.github/workflows/reusable-workflow-lint.yml@f46116661fa12e4ff3911c40970cf0f8510e9823 # v1.0.0
